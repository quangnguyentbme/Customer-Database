<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Đối Tác Hàng Không</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid font-bold text-2xl text-indigo-400 fa-plane-departure"></i>
                <h1 class="text-xl font-bold tracking-wide">Airline Partner Hub</h1>
            </div>
            <span class="text-xs bg-indigo-800 text-indigo-200 px-3 py-1 rounded-full border border-indigo-700">Supabase Connected</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase">Tổng Đối Tác</p>
                    <h3 id="statTotal" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-indigo-50 rounded-lg flex items-center justify-center text-indigo-600">
                    <i class="fa-solid fa-handshake text-xl"></i>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase">Hãng Bay Nội Địa/Quốc Tế</p>
                    <h3 id="statAirlines" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-blue-50 rounded-lg flex items-center justify-center text-blue-600">
                    <i class="fa-solid fa-plane text-xl"></i>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase">Đại Lý & GSA</p>
                    <h3 id="statAgents" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-emerald-50 rounded-lg flex items-center justify-center text-emerald-600">
                    <i class="fa-solid fa-building text-xl"></i>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase">Hợp Đồng Đang Chạy</p>
                    <h3 id="statActive" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-amber-50 rounded-lg flex items-center justify-center text-amber-600">
                    <i class="fa-solid fa-file-contract text-xl"></i>
                </div>
            </div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col sm:flex-row gap-4 justify-between items-center">
            <div class="flex flex-1 gap-4 w-full sm:w-auto">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="filterData()" placeholder="Tìm theo tên, mã đối tác, IATA..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <select id="typeFilter" onchange="filterData()" class="border border-slate-300 rounded-lg text-sm px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="">Tất cả loại hình</option>
                    <option value="Domestic Airline">Hãng bay Nội Địa</option>
                    <option value="International Airline">Hãng bay Quốc Tế</option>
                    <option value="GSA">GSA / Đại diện hãng</option>
                    <option value="F1 Agent">Đại lý F1</option>
                    <option value="OTA">OTA / Nền tảng số</option>
                </select>
            </div>
            <button onclick="openModal()" class="w-full sm:w-auto px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg shadow-sm flex items-center justify-center gap-2 transition">
                <i class="fa-solid fa-plus"></i> Thêm Đối Tác
            </button>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-100 border-b border-slate-200 text-slate-600 font-semibold uppercase text-xs">
                            <th class="p-4">Mã ĐT</th>
                            <th class="p-4">Tên Đối Tác / IATA</th>
                            <th class="p-4">Loại Hình</th>
                            <th class="p-4">Liên Hệ</th>
                            <th class="p-4">Hạn Mức Công Nợ</th>
                            <th class="p-4">Trạng Thái</th>
                            <th class="p-4 text-center">Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody id="partnerTableBody" class="divide-y divide-slate-100">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="partnerModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden">
            <div class="bg-slate-100 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                <h3 class="font-bold text-slate-800">Thêm Đối Tác Hàng Không</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="partnerForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Mã Đối Tác *</label>
                        <input type="text" id="partner_code" required placeholder="VD: VN-AG01" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Mã IATA</label>
                        <input type="text" id="iata_code" placeholder="VD: VN, VJ, SQ" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Tên Đối Tác / Hãng Bay *</label>
                    <input type="text" id="partner_name" required placeholder="VD: Vietnam Airlines / Bamboo Airways" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Loại Hình *</label>
                        <select id="partner_type" required class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                            <option value="Domestic Airline">Hãng bay Nội Địa</option>
                            <option value="International Airline">Hãng bay Quốc Tế</option>
                            <option value="GSA">GSA / Tổng đại lý</option>
                            <option value="F1 Agent">Đại lý F1</option>
                            <option value="OTA">OTA / Nền tảng số</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Trạng Thái Hợp Đồng</label>
                        <select id="contract_status" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                            <option value="Active">Hiệu lực (Active)</option>
                            <option value="Pending">Chờ duyệt (Pending)</option>
                            <option value="Expired">Hết hạn (Expired)</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Người Liên Hệ</label>
                        <input type="text" id="contact_person" placeholder="Họ và tên Sales Rep" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Số Điện Thoại</label>
                        <input type="text" id="phone" placeholder="0901234567" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Email</label>
                        <input type="email" id="email" placeholder="sales@partner.com" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Hạn Mức Công Nợ (VNĐ)</label>
                        <input type="number" id="credit_limit" placeholder="500000000" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Ghi Chú / Chính Sách Hoa Hồng</label>
                    <textarea id="notes" rows="2" placeholder="Nhập tỷ lệ hoa hồng, điều khoản công nợ..." class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-2 border-t border-slate-200">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 text-slate-600 text-sm font-medium rounded-lg hover:bg-slate-50">Hủy</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 shadow-sm">Lưu Dữ Liệu</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 1. Cấu hình thông tin Supabase của bạn ở đây:
        const SUPABASE_URL = 'ĐIỀN_SUPABASE_PROJECT_URL_CỦA_BẠN';
        const SUPABASE_KEY = 'ĐIỀN_SUPABASE_ANON_KEY_CỦA_BẠN';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let rawPartnersData = [];

        // 2. Hàm lấy dữ liệu từ Supabase
        async function loadPartners() {
            const { data, error } = await _supabase
                .from('airline_partners')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Lỗi lấy dữ liệu:", error.message);
                return;
            }

            rawPartnersData = data || [];
            updateDashboardUI(rawPartnersData);
        }

        // 3. Hàm render giao diện & KPIs
        function updateDashboardUI(data) {
            const tbody = document.getElementById('partnerTableBody');
            tbody.innerHTML = '';

            // Cập nhật KPIs
            document.getElementById('statTotal').innerText = data.length;
            document.getElementById('statAirlines').innerText = data.filter(d => d.partner_type.includes('Airline')).length;
            document.getElementById('statAgents').innerText = data.filter(d => d.partner_type === 'GSA' || d.partner_type === 'F1 Agent').length;
            document.getElementById('statActive').innerText = data.filter(d => d.contract_status === 'Active').length;

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-400">Chưa có dữ liệu đối tác. Bấm "Thêm Đối Tác" để khởi tạo.</td></tr>`;
                return;
            }

            data.forEach(item => {
                const formattedCredit = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(item.credit_limit || 0);
                
                let badgeColor = "bg-emerald-100 text-emerald-800 border-emerald-200";
                if(item.contract_status === 'Pending') badgeColor = "bg-amber-100 text-amber-800 border-amber-200";
                if(item.contract_status === 'Expired') badgeColor = "bg-rose-100 text-rose-800 border-rose-200";

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                tr.innerHTML = `
                    <td class="p-4 font-mono font-semibold text-indigo-900">${item.partner_code}</td>
                    <td class="p-4">
                        <div class="font-medium text-slate-900">${item.partner_name}</div>
                        ${item.iata_code ? `<span class="text-xs text-slate-500">IATA: <b>${item.iata_code}</b></span>` : ''}
                    </td>
                    <td class="p-4 text-xs">
                        <span class="bg-slate-100 text-slate-700 px-2.5 py-1 rounded-md border border-slate-200 font-medium">${item.partner_type}</span>
                    </td>
                    <td class="p-4 text-xs">
                        <div class="font-medium text-slate-800">${item.contact_person || '—'}</div>
                        <div class="text-slate-500 mt-0.5">${item.phone || ''} ${item.email ? `| ${item.email}` : ''}</div>
                    </td>
                    <td class="p-4 font-mono text-slate-700 text-xs">${formattedCredit}</td>
                    <td class="p-4">
                        <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold border ${badgeColor}">${item.contract_status}</span>
                    </td>
                    <td class="p-4 text-center">
                        <button onclick="deletePartner('${item.id}')" class="text-slate-400 hover:text-rose-600 transition" title="Xóa"><i class="fa-solid fa-trash-can"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 4. Tìm kiếm & Lọc dữ liệu
        function filterData() {
            const searchValue = document.getElementById('searchInput').value.toLowerCase();
            const typeValue = document.getElementById('typeFilter').value;

            const filtered = rawPartnersData.filter(item => {
                const matchSearch = item.partner_name.toLowerCase().includes(searchValue) ||
                                    item.partner_code.toLowerCase().includes(searchValue) ||
                                    (item.iata_code && item.iata_code.toLowerCase().includes(searchValue));
                const matchType = typeValue === '' || item.partner_type === typeValue;
                return matchSearch && matchType;
            });

            updateDashboardUI(filtered);
        }

        // 5. Thêm mới đối tác
        async function handleFormSubmit(e) {
            e.preventDefault();
            const payload = {
                partner_code: document.getElementById('partner_code').value,
                iata_code: document.getElementById('iata_code').value,
                partner_name: document.getElementById('partner_name').value,
                partner_type: document.getElementById('partner_type').value,
                contract_status: document.getElementById('contract_status').value,
                contact_person: document.getElementById('contact_person').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                credit_limit: parseFloat(document.getElementById('credit_limit').value) || 0,
                notes: document.getElementById('notes').value
            };

            const { error } = await _supabase.from('airline_partners').insert([payload]);

            if (error) {
                alert("Lỗi thêm dữ liệu: " + error.message);
            } else {
                closeModal();
                document.getElementById('partnerForm').reset();
                loadPartners(); // Reload lại danh sách
            }
        }

        // 6. Xóa đối tác
        async function deletePartner(id) {
            if (confirm("Bạn có chắc chắn muốn xóa đối tác này?")) {
                const { error } = await _supabase.from('airline_partners').delete().eq('id', id);
                if (error) alert("Lỗi khi xóa: " + error.message);
                else loadPartners();
            }
        }

        // Điều khiển Modal
        function openModal() { document.getElementById('partnerModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('partnerModal').classList.add('hidden'); }

        // Khởi chạy ứng dụng
        loadPartners();
    </script>
</body>
</html>
