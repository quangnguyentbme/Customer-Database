<html lang="en">

<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CRM">

<style>
:root{--bg:#f5f5f7;--w:#fff;--t:#1d1d1f;--t2:#6e6e73;--t3:#aeaeb2;--bd:#d2d2d7;--bl:#e8e8ed;--grn:#34c759;--gbg:#f0faf2;--blu:#007aff;--bbg:#f0f5ff;--org:#ff9500;--obg:#fff8f0;--pnk:#ff2d55;--pbg:#fff0f3;--pur:#af52de;--tl:#5ac8fa;--r:16px;--rs:10px;--sh:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Calibri',Arial,sans-serif;background:var(--bg);color:var(--t);-webkit-font-smoothing:antialiased;font-size:13px}
select,select option,input,textarea{ text-transform:uppercase}
.app{max-width:1500px;margin:0 auto;padding:24px 20px 80px}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.hdr h1{font-size:32px;font-weight:600;letter-spacing:-1px}
.hdr p{color:var(--t2);font-size:13px;margin-top:2px}
.hdr-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{font-family:inherit;font-size:11px;font-weight:600;padding:7px 16px;border-radius:99px;border:none;cursor:pointer;transition:all .2s}
.btn-b{background:var(--blu);color:#fff}.btn-b:hover{background:#006ae0}
.btn-g{background:var(--gbg);color:var(--grn)}.btn-o{background:var(--obg);color:var(--org)}
.btn-p{background:var(--pbg);color:var(--pnk)}
/* Tabs */
.tabs{display:flex;gap:3px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.tab{flex-shrink:0;font-family:inherit;font-size:15px;font-weight:500;padding:7px 14px;border-radius:99px;border:1px solid var(--bl);background:var(--w);color:var(--t2);cursor:pointer;transition:all .2s;white-space:nowrap}
.tab:hover{border-color:var(--blu);color:var(--blu)}
.tab.a{background:var(--blu);border-color:var(--blu);color:#fff}
.tab .cnt{font-size:px;background:rgba(255,255,255,.3);padding:1px 5px;border-radius:99px;margin-left:4px}
.tab.a .cnt{background:rgba(255,255,255,.3)}
/* Stats */
.sts{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.st{background:var(--w);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.st-v{font-size:24px;font-weight:600}
.st-lb{font-size:12px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px}
/* Card */
.cd{background:var(--w);border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:14px}
.cd-t{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px}
/* Search */
.search-bar{display:flex;gap:8px;margin-bottom:14px}
.search-input{flex:1;font-family:inherit;font-size:13px;padding:9px 14px;border:1px solid var(--bl);border-radius:var(--rs);outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--blu)}
/* Table */
.tbl-wrap{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:11px;white-space:nowrap}
table.dt th,table.dt td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bl);text-transform:uppercase;}
table.dt th{background:var(--bg);font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;font-size:11px;position:sticky;top:0;z-index:1}
table.dt tr:hover{background:var(--bbg)}
table.dt tr{cursor:pointer}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.3px}
.badge-g{background:var(--gbg);color:var(--grn)}
.badge-b{background:var(--bbg);color:var(--blu)}
.badge-o{background:var(--obg);color:var(--org)}
.badge-p{background:var(--pbg);color:var(--pnk)}
.badge-gr{background:var(--bg);color:var(--t3)}
/* Modal */
.modal-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:999;display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.modal-bg.show{display:flex}
.modal{background:var(--w);border-radius:20px;width:100%;max-width:800px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
.modal h2{font-size:20px;font-weight:600;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.form-group{display:flex;flex-direction:column;gap:3px}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select,.form-group textarea{font-family:inherit;font-size:12px;padding:8px 10px;border:1px solid var(--bl);border-radius:8px;outline:none;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--blu)}
.form-group textarea{resize:vertical;min-height:60px}
.form-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--t);color:#fff;font-family:inherit;font-size:12px;font-weight:500;padding:10px 20px;border-radius:99px;box-shadow:0 4px 20px rgba(0,0,0,.2);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:9999;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.col-toggle{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.col-chip{font-size:10px;padding:4px 10px;border-radius:99px;border:1px solid var(--bl);background:var(--w);cursor:pointer;user-select:none}
.col-chip.on{background:var(--bbg);border-color:var(--blu);color:var(--blu)}
.filter-input{width:100%;font-family:inherit;font-size:10px;padding:3px 6px;border:1px solid var(--bl);border-radius:4px;outline:none;margin-top:4px}
.filter-input:focus{border-color:var(--blu)}
@media(max-width:900px){.sts{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.sts{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.app{padding:16px 10px 60px}}
.dt th{
  position:relative;
}

.col-filter-menu{
  display:none;
  position:fixed;
  z-index:99999;
  width:230px;
  background:#fff;
  border:1px solid #d2d2d7;
  border-radius:10px;
  box-shadow:0 6px 24px rgba(0,0,0,.16);
  padding:10px;
  text-align:left;
  font-weight:400;
}

.col-filter-menu.show{
  display:block;
}

.col-filter-search{
  width:100%;
  border:1px solid #d2d2d7;
  border-radius:6px;
  padding:6px 8px;
  font-family:inherit;
  font-size:11px;
  margin-bottom:8px;
}

.col-filter-actions{
  display:flex;
  gap:5px;
  margin-bottom:7px;
  padding-bottom:7px;
  border-bottom:1px solid #e8e8ed;
}

.col-filter-actions button,
.col-filter-footer button{
  border:0;
  border-radius:6px;
  padding:5px 8px;
  font-family:inherit;
  font-size:10px;
  cursor:pointer;
}

.col-filter-options{
  max-height:180px;
  overflow-y:auto;
  overflow-x:hidden;
  padding-right:3px;
}

.col-filter-option{
  display:flex;
  align-items:center;
  gap:7px;
  padding:5px 3px;
  font-size:11px;
  cursor:pointer;
  text-transform:uppercase;
}

.col-filter-option:hover{
  background:#f5f5f7;
}

.col-filter-option input{
  margin:0;
}

.col-filter-footer{
  display:flex;
  justify-content:flex-end;
  gap:5px;
  margin-top:7px;
  padding-top:7px;
  border-top:1px solid #e8e8ed;
  background:#fff;
}

.col-filter-clear{
  background:#f5f5f7;
  color:#6e6e73;
}

.col-filter-apply{
  background:#007aff;
  color:#fff;
}
.filter-funnel{border:none;background:transparent;outline:none;box-shadow:none}
.filter-funnel.active{color:var(--blu);font-weight:700}
</style>
</head>

// ═══ SUPABASE SYNC ═══
let _pullDone=false;

async function syncPull(){
  if(!_cloudOK){toast('⚠ Supabase unconfigured');return}
  $('syncBadge').textContent='🔄 Loading...';$('syncBadge').style.color='var(--blu)';
  try{const res=await fetch(SUPABASE_URL+'/rest/v1/crm_data?select=id,data',{headers:_sbH});
    if(!res.ok){$('syncBadge').textContent='🔴 Error';$('syncBadge').style.color='var(--pnk)';return}
    const rows=await res.json();
    // Cloud is master — always load cloud data
    rows.forEach(r=>{if(r.data&&Array.isArray(r.data)&&r.data.length>0){data[r.id]=r.data}});
    _pullDone=true;
    saveLocal();renderAll();
    $('syncBadge').textContent='🟢 Loaded';$('syncBadge').style.color='var(--grn)'
  }catch(e){$('syncBadge').textContent='🔴 Offline';$('syncBadge').style.color='var(--pnk)';console.error(e)}}

function autoPush(){
  if(!_cloudOK)return;
  // NEVER push if pull hasn't completed
  if(!_pullDone)return;
  // Don't push if no real data
  const hasData=ENTITY_KEYS.some(k=>(data[k]||[]).length>0);
  if(!hasData)return;
  ENTITY_KEYS.forEach(eid=>{
    const arr=data[eid]||[];
    if(arr.length>0){
      try{fetch(SUPABASE_URL+'/rest/v1/crm_data?id=eq.'+eid,{method:'PATCH',keepalive:true,
        headers:_sbH,body:JSON.stringify({data:arr,updated_at:new Date().toISOString()})})}catch(e){console.error(e)}}})}

async function syncPush(){
  if(!_cloudOK){toast('⚠ Supabase unconfigured');return}
  toast('🔄 Loading...');
  try{
    // Pull first — merge: cloud fills gaps, local wins
    const res=await fetch(SUPABASE_URL+'/rest/v1/crm_data?select=id,data',{headers:_sbH});
    if(res.ok){const rows=await res.json();
      rows.forEach(r=>{if(r.data&&Array.isArray(r.data)&&r.data.length>0){
        const localArr=data[r.id]||[];
        if(localArr.length===0){data[r.id]=r.data}}})}
    saveLocal();renderAll();
    // Then push merged data
    let ok=0;
    for(const eid of ENTITY_KEYS){
      const arr=data[eid]||[];
      const r=await fetch(SUPABASE_URL+'/rest/v1/crm_data?id=eq.'+eid,{method:'PATCH',
        headers:_sbH,body:JSON.stringify({data:arr,updated_at:new Date().toISOString()})});
      if(r.ok)ok++}
    _pullDone=true;
    $('syncBadge').textContent='🟢 Loaded';$('syncBadge').style.color='var(--grn)';
    toast('✓ Loaded '+ok+' tables')
  }catch(e){toast('⚠ Error');console.error(e)}}

let hiddenCols={};
let colFilters={};

function toggleColPanel(){
  const p=$('colPanel');
  p.style.display=p.style.display==='none'?'':'none';
  if(p.style.display!=='none')renderColToggle()}

function renderColToggle(){
  const e=ENTITIES[curEntity];
  const cols=e.fields.filter(f=>f.listCol);
  const hid=hiddenCols[curEntity]||[];
  $('colToggle').innerHTML=cols.map(f=>
    `<span class="col-chip ${hid.includes(f.k)?'':'on'}" onclick="toggleCol('${f.k}')">${f.l}</span>`
  ).join('')}

function toggleCol(k){
  if(!hiddenCols[curEntity])hiddenCols[curEntity]=[];
  const arr=hiddenCols[curEntity];
  const idx=arr.indexOf(k);
  if(idx>=0)arr.splice(idx,1);else arr.push(k);
  renderColToggle();renderList()}

function renderList(){
  const eid=curEntity;
  const e=ENTITIES[eid];
  const q=($('searchBox').value||'').toLowerCase();
  let items=(data[eid]||[]).slice();

  // Global search
  if(q){
    items=items.filter(item=>
      e.searchKeys.some(k=>
        String(item[k]||'').toLowerCase().includes(q)
      )
    );
  }

  const hid=hiddenCols[eid]||[];
  const cols=e.fields.filter(f=>f.listCol&&!hid.includes(f.k));

  // ═══ APPLY COLUMN FILTERS ═══
  const cf=colFilters[eid]||{};

  Object.entries(cf).forEach(([k,v])=>{
    if(!v)return;

    items=items.filter(item=>{
      let val=item[k]||'';

      if(k==='full_name'){
        val=(item.first_name||'')+' '+(item.last_name||'');
      }

      // Filter bằng PHỄU - chọn nhiều giá trị
      if(typeof v==='object' && v.type==='multi'){
        if(!v.values || v.values.length===0)return true;

        return v.values.some(x=>
          String(val).trim().toLowerCase()===
          String(x).trim().toLowerCase()
        );
      }

      // Filter bằng ô SOFT...
      return String(val)
        .toLowerCase()
        .includes(String(v).toLowerCase());
    });
  });

  items.reverse();

  // ═══ TABLE HEADER ═══
  let h='<table class="dt"><thead><tr><th>#</th>';

  cols.forEach(f=>{
    const filterValue=cf[f.k];

    // Chỉ hiển thị text filter nếu filter là dạng text
    const fv=
      typeof filterValue==='string'
        ? filterValue
        : '';

    // Kiểm tra cột đang có filter phễu hay không
    const hasMultiFilter=
      typeof filterValue==='object' &&
      filterValue.type==='multi' &&
      filterValue.values &&
      filterValue.values.length>0;

    h+=`<th>
      <div class="th-filter-head">
        <span>${f.l}</span>

        <button
          type="button"
          class="filter-funnel ${hasMultiFilter?'active':''}"
          data-fk="${f.k}"
          onclick="openColFilter(event,'${f.k}')"
        >⋮</button>
      </div>

      <input
        class="filter-input"
        data-fk="${f.k}"
        value="${escapeHtml(fv)}"
        placeholder="SOFT..."
        oninput="setFilter(this)"
      >

      <div
        class="col-filter-menu"
        id="col-filter-${f.k}"
        onclick="event.stopPropagation()"
      ></div>
    </th>`;
  });

  h+='</tr></thead><tbody>';

  // ═══ TABLE BODY ═══
  if(items.length===0){
    h+=`<tr>
      <td colspan="${cols.length+1}"
        style="text-align:center;padding:40px;color:var(--t3)">
        Không có dữ liệu
      </td>
    </tr>`;
  }
  else{
    items.forEach((item,idx)=>{
      const realIdx=(data[eid]||[]).indexOf(item);

      h+=`<tr onclick="openForm(${realIdx})">
        <td style="color:var(--t3)">${items.length-idx}</td>`;

      cols.forEach(f=>{
        let v=item[f.k]||'';

        if(f.computed&&f.k==='full_name'){
          v=(item.first_name||'')+' '+(item.last_name||'');
        }

        if(f.badge&&v){
          v=`<span class="badge badge-${badgeClass(v)}">${v}</span>`;
        }

        if(f.type==='number'&&v){
          v=Number(v).toLocaleString();
        }

        h+=`<td>${v}</td>`;
      });

      h+='</tr>';
    });
  }

  h+=`</tbody></table>
    <div style="font-size:10px;color:var(--t3);margin-top:8px">
      ${items.length} results
    </div>`;

  $('tableWrap').innerHTML=h;
}


// ═══ TEXT FILTER: SOFT... ═══
function setFilter(el){
  const eid=curEntity;

  if(!colFilters[eid]){
    colFilters[eid]={};
  }

  colFilters[eid][el.dataset.fk]=el.value;

  renderList();

  // Giữ focus sau khi render lại bảng
  setTimeout(()=>{
    const inp=document.querySelector(
      `[data-fk="${el.dataset.fk}"]`
    );

    if(inp){
      inp.focus();
      inp.selectionStart=inp.value.length;
    }
  },0);
}


// ═══ EXCEL-STYLE COLUMN FILTER ═══

const colFilterChecks={};


function openColFilter(e,fk){
  e.stopPropagation();

  // Đóng các menu khác
  document.querySelectorAll('.col-filter-menu.show').forEach(x=>{
    if(x.id!=='col-filter-'+fk){
      x.classList.remove('show');
    }
  });

  const menu=document.getElementById('col-filter-'+fk);

  if(!menu)return;

  // Nếu đang mở thì đóng
  if(menu.classList.contains('show')){
    menu.classList.remove('show');
    return;
  }

  buildColFilter(fk,menu);

  // Đặt menu theo vị trí của nút phễu
  const btn=e.currentTarget;
  const rect=btn.getBoundingClientRect();

  menu.style.top=(rect.bottom+4)+'px';
  menu.style.left=rect.left+'px';

  menu.classList.add('show');
}


function buildColFilter(fk,menu){

  const items=data[curEntity]||[];

  // Lấy toàn bộ giá trị duy nhất của cột
  const values=[...new Set(
    items
      .map(item=>{
        let v=item[fk]||'';

        if(fk==='full_name'){
          v=(item.first_name||'')+' '+(item.last_name||'');
        }

        return String(v).trim();
      })
      .filter(v=>v!=='')
  )].sort((a,b)=>a.localeCompare(b));

  // Nếu trước đó đã chọn thì giữ lại
  const selected=colFilterChecks[fk]||[];

  menu.innerHTML=`
    <input
      class="col-filter-search"
      placeholder="SEARCH..."
      oninput="searchColFilter(this,'${fk}')"
    >

    <div class="col-filter-actions">
      <button
        type="button"
        onclick="selectAllColFilter('${fk}')"
      >SELECT ALL</button>

      <button
        type="button"
        onclick="clearColFilter('${fk}')"
      >CLEAR</button>
    </div>

    <div
      class="col-filter-options"
      id="col-options-${fk}"
    >
      ${values.map(v=>`
        <label
          class="col-filter-option"
          data-value="${escapeHtml(v.toLowerCase())}"
        >
          <input
            type="checkbox"
            value="${escapeHtml(v)}"
            ${selected.includes(v)?'checked':''}
            onchange="toggleColFilterValue('${fk}',this)"
          >

          <span>${escapeHtml(v)}</span>
        </label>
      `).join('')}
    </div>

    <div class="col-filter-footer">
      <button
        type="button"
        class="col-filter-clear"
        onclick="clearColFilter('${fk}')"
      >CLEAR</button>

      <button
        type="button"
        class="col-filter-apply"
        onclick="applyColFilter('${fk}')"
      >APPLY</button>
    </div>
  `;
}


// ═══ CHECK / UNCHECK ═══

function toggleColFilterValue(fk,el){

  if(!colFilterChecks[fk]){
    colFilterChecks[fk]=[];
  }

  if(el.checked){

    if(!colFilterChecks[fk].includes(el.value)){
      colFilterChecks[fk].push(el.value);
    }

  }else{

    colFilterChecks[fk]=
      colFilterChecks[fk].filter(v=>v!==el.value);

  }
}


// ═══ SELECT ALL ═══

function selectAllColFilter(fk){

  const menu=document.getElementById(
    'col-filter-'+fk
  );

  if(!menu)return;

  const checks=
    menu.querySelectorAll(
      'input[type="checkbox"]'
    );

  colFilterChecks[fk]=[];

  checks.forEach(c=>{
    c.checked=true;

    colFilterChecks[fk].push(c.value);
  });
}


// ═══ CLEAR ═══

function clearColFilter(fk){

  colFilterChecks[fk]=[];

  if(!colFilters[curEntity]){
    colFilters[curEntity]={};
  }

  delete colFilters[curEntity][fk];

  const menu=document.getElementById(
    'col-filter-'+fk
  );

  if(menu){
    menu
      .querySelectorAll('input[type="checkbox"]')
      .forEach(c=>{
        c.checked=false;
      });

    menu.classList.remove('show');
  }

  renderList();
}


// ═══ APPLY PHỄU ═══

function applyColFilter(fk){

  const selected=
    colFilterChecks[fk]||[];

  if(!colFilters[curEntity]){
    colFilters[curEntity]={};
  }

  // Không chọn gì = bỏ filter
  if(selected.length===0){

    delete colFilters[curEntity][fk];

  }else{

    // Lưu dạng multi-select
    colFilters[curEntity][fk]={
      type:'multi',
      values:[...selected]
    };
  }

  const menu=document.getElementById(
    'col-filter-'+fk
  );

  if(menu){
    menu.classList.remove('show');
  }

  // QUAN TRỌNG:
  // renderList() sẽ lọc lại bảng
  // và ẩn những dòng không được chọn
  renderList();
}


// ═══ SEARCH TRONG PHỄU ═══

function searchColFilter(input,fk){

  const q=input.value.toLowerCase();

  document.querySelectorAll(
    '#col-options-'+fk+
    ' .col-filter-option'
  ).forEach(el=>{

    el.style.display=
      el.dataset.value.includes(q)
        ? 'flex'
        : 'none';

  });
}


// ═══ ESCAPE HTML ═══

function escapeHtml(v){

  return String(v)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}

// ═══ CLICK RA NGOÀI → ĐÓNG PHỄU ═══

document.addEventListener('click',e=>{

  if(
    !e.target.closest('.col-filter-menu') &&
    !e.target.closest('.filter-funnel')
  ){

    document
      .querySelectorAll('.col-filter-menu.show')
      .forEach(x=>{
        x.classList.remove('show');
      });

  }

});

function openForm(idx){
  editIdx=typeof idx==='number'?idx:-1;
  const eid=curEntity;const e=ENTITIES[eid];
  const item=editIdx>=0?(data[eid]||[])[editIdx]:{};

  $('formTitle').textContent=editIdx>=0?'Edit '+e.label.slice(0,-1):'DATA INPUT';
  $('btnDel').style.display=editIdx>=0?'':'none';

  let h='';
  e.fields.forEach(f=>{
    if(f.auto&&editIdx<0)return; // skip auto ID for new records
    if(f.computed)return;
    const val=item[f.k]||'';
    const cls=f.type==='textarea'?'full':'';
    h+=`<div class="form-group ${cls}"><label>${f.l}${f.required?' *':''}</label>`;
    if(f.k==='company_name'&&f.type==='text'){
      const companies=(data.companies||[]).map(c=>c.company_name).filter(Boolean).sort();
      h+=`<select data-key="${f.k}"><option value="">-- SELECT Company --</option>`;
      companies.forEach(c=>{h+=`<option value="${c}"${val===c?' selected':''}>${c}</option>`});
      h+=`<option value="__other">+ Enter manually</option></select>`;
      h+=`<input type="text" data-key="${f.k}_manual" placeholder="Enter new name..." style="display:none;margin-top:4px">`;
      h+=`</div>`;return}
    if(f.type==='select'){
      h+=`<select data-key="${f.k}"><option value="">-- SELECT --</option>`;
      (f.opts||[]).forEach(o=>{h+=`<option value="${o}"${val===o?' selected':''}>${o}</option>`});
      h+=`</select>`}
    else if(f.type==='textarea'){h+=`<textarea data-key="${f.k}">${val}</textarea>`}
    else{h+=`<input type="${f.type||'text'}" data-key="${f.k}" value="${val}"${f.auto?' readonly style="background:var(--bg)"':''}>`}
    h+=`</div>`});

  $('formFields').innerHTML=h;
    // Show manual input when "Enter manually" selected
  $('formFields').querySelectorAll('select[data-key="company_name"]').forEach(sel=>{
    sel.addEventListener('change',()=>{
      const manual=sel.parentElement.querySelector('[data-key="company_name_manual"]');
      if(manual)manual.style.display=sel.value==='__other'?'':'none'})});
  $('modalBg').classList.add('show')}

function closeForm(){$('modalBg').classList.remove('show');editIdx=-1}

function saveForm(){
  const eid=curEntity;const e=ENTITIES[eid];
  if(!data[eid])data[eid]=[];

  const record=editIdx>=0?{...data[eid][editIdx]}:{};

  // Read form values
  $('formFields').querySelectorAll('[data-key]').forEach(el=>{
    if(el.dataset.key.endsWith('_manual'))return;
    let v=el.value.trim();
    if(el.dataset.key==='company_name'&&v==='__other'){
      const manual=$('formFields').querySelector('[data-key="company_name_manual"]');
      v=manual?manual.value.trim():''}
    record[el.dataset.key]=v});

  // Auto-generate ID for new records
  if(editIdx<0){
    const idField=e.fields.find(f=>f.auto);
    if(idField)record[idField.k]=genId()}

  // Compute full_name for contacts
  if(eid==='contacts')record.full_name=(record.first_name||'')+' '+(record.last_name||'');

  // Validate required
  const missing=e.fields.filter(f=>f.required&&!record[f.k]);
  if(missing.length){toast('⚠ Missing: '+missing.map(f=>f.l).join(', '));return}

  // Save
  if(editIdx>=0){data[eid][editIdx]=record}
  else{data[eid].push(record)}

  saveLocal();closeForm();renderAll();
  toast(editIdx>=0?'✓ Already updated':'✓ Added new')}

function deleteRecord(){
  if(!confirm('Delete this record?'))return;
  const eid=curEntity;
  if(editIdx>=0&&data[eid]){data[eid].splice(editIdx,1);saveLocal();closeForm();renderAll();toast('✓ Deleted')}}

// ═══ EXPORT CSV ═══
function exportAll(){
  const eid=curEntity;const e=ENTITIES[eid];
  const items=data[eid]||[];if(!items.length){toast('No data to export');return}
  const cols=e.fields.filter(f=>!f.computed);
  const hdr=cols.map(f=>f.l).join(',');
  const rows=[hdr,...items.map(item=>cols.map(f=>{let v=item[f.k]||'';v=String(v).toUpperCase().replace(/"/g,'""');return v.includes(',')?`"${v}"`:v}).join(','))];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv;charset=utf-8;'}));
  a.download=`CRM_${eid}_${new Date().toISOString().slice(0,10)}.csv`;a.click();toast('✓ CSV exported')}

// ═══ INIT ═══
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){autoPush()}});
window.addEventListener('beforeunload',()=>{autoPush()});
window.addEventListener('pagehide',()=>{autoPush()});

document.addEventListener('DOMContentLoaded',async()=>{
  data=loadLocal();
  ENTITY_KEYS.forEach(k=>{if(!data[k])data[k]=[]});
  if(_cloudOK)await syncPull();
  renderAll();
  if(!_cloudOK){$('syncBadge').textContent='⚪ Offline'}
});
</script>
